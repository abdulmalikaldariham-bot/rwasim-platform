# إعداد Supabase CLI للتطوير المحلي (supabase start) — يتطلب Docker
project_id = "rawasim-platform"

[api]
enabled = true
port = 54321
schemas = ["public", "storage"]

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
# التسجيل الذاتي مغلق: الحسابات ينشئها المدير التنفيذي أو مسؤول النظام فقط
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

[storage]
enabled = true
file_size_limit = "25MiB"
